<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0505a9" />
    </linearGradient>
    <linearGradient id="cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0505a9" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Container -->
  <rect width="120" height="120" rx="28" fill="url(#bg-grad)" filter="url(#shadow)" />

  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Clinical Medical Cross -->
  <path d="M48 24h24v24h24v24H72v24H48V72H24V48h24V24z" rx="6" fill="url(#cross-grad)" />

  <!-- Heartbeat Pulse Accent in Emerald/Teal -->
  <path d="M30 60h18l6-14 12 28 8-18 6 4h10" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

